<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Jair M. — Origami en movimiento</title>
  <!-- Ejemplo AUTÓNOMO: funciona sin conexión. Copia la figura + CSS + JS a tu web. -->
  <style>
/*
 * ORIGAMI / JAIR M.
 * Colores: cambia --oj-ink en cada tema. Tamaño: --oj-size.
 * Velocidad: data-duration="12000" en la figura del HTML (milisegundos).
 * Los nombres oj-* están encapsulados; no afectan al resto de la página.
 */
.origami-journey {
  --oj-ink: #246b4b;
  --oj-orbit-opacity: .26;
  --oj-connection-opacity: .42;
  --oj-logo-edge: #806b25;
  --oj-neutral: #26251e;
  --oj-size: 480px;
  box-sizing: border-box;
  width: 100%;
  max-width: var(--oj-size);
  margin: 24px 0 0;
  color: var(--oj-ink);
}
html[data-theme="dark"] .origami-journey {
  --oj-ink: #8fd5ae;
  --oj-orbit-opacity: .23;
  --oj-connection-opacity: .45;
  --oj-logo-edge: transparent;
  --oj-neutral: #edecec;
}
.origami-journey .oj-art {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 640 / 460;
  overflow: hidden;
  background: transparent;
  isolation: isolate;
}
.origami-journey .oj-orbits {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  opacity: var(--oj-orbit-opacity);
}
.origami-journey .oj-orbit-node { fill: currentColor; stroke: none; }
.origami-journey .oj-bird {
  fill: none;
  stroke: currentColor;
  stroke-width: 4.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.origami-journey .oj-link {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  stroke-linecap: round;
  stroke-opacity: var(--oj-connection-opacity);
  opacity: 0;
}
.origami-journey .oj-packet { fill: currentColor; opacity: 0; }
.origami-journey .oj-packet-halo { opacity: .14; }
.origami-journey .oj-logo { opacity: 1; }
.origami-journey .oj-neutral { color: var(--oj-neutral); }
.origami-journey .oj-yellow {
  stroke: var(--oj-logo-edge);
  stroke-width: 1.2;
  stroke-linejoin: round;
  paint-order: stroke fill;
}
.origami-journey .oj-float,
.origami-journey .oj-wing,
.origami-journey .oj-logo,
.origami-journey .oj-packet {
  transform-box: view-box;
  transform-origin: 0 0;
}
.origami-journey .oj-controls {
  display: flex;
  justify-content: flex-end;
  margin-top: -8px;
}
.origami-journey .oj-toggle {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid currentColor;
  border-radius: 50%;
  background: transparent;
  color: var(--oj-ink);
  cursor: pointer;
  touch-action: manipulation;
}
.origami-journey .oj-toggle:focus-visible {
  outline: 2px solid var(--oj-ink);
  outline-offset: 4px;
}
.origami-journey .oj-toggle:disabled { opacity: .45; cursor: default; }
.origami-journey .oj-toggle[hidden] { display: none; }
.origami-journey .oj-toggle svg { display: block; width: 16px; height: 16px; }
.origami-journey .oj-play { display: none; }
.origami-journey .oj-toggle[aria-pressed="true"] .oj-play { display: block; }
.origami-journey .oj-toggle[aria-pressed="true"] .oj-pause { display: none; }
/* Respaldo estático incluso antes de que se ejecute JavaScript. */
@media (prefers-reduced-motion: reduce) {
  .origami-journey .oj-logo { opacity: 1 !important; transform: none !important; }
  .origami-journey .oj-float,
  .origami-journey .oj-wing { transform: none !important; }
  .origami-journey .oj-link,
  .origami-journey .oj-packet { opacity: 0 !important; }
}

  /* Solo la demostración: el SVG sigue teniendo fondo transparente. */
  .oj-demo-page {
    --demo-bg: #f7f4e9;
    --demo-ink: #246b4b;
    box-sizing: border-box;
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--demo-bg);
    color: var(--demo-ink);
    font-family: system-ui, sans-serif;
  }
  html[data-theme="dark"] .oj-demo-page { --demo-bg: #101310; --demo-ink: #8fd5ae; }
  .oj-demo-layout { width: min(100%, 720px); }
  .oj-demo-page .origami-journey { margin: 24px auto 0; }
  .oj-demo-theme {
    display: block;
    margin-left: auto;
    padding: 12px 20px;
    border: 1px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .oj-demo-theme:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  .oj-demo-theme[hidden] { display: none; }

        if (reduced.matches) animation.cancel(); // Estilo base: composición completa y estática.
        else if (stopped || !visible || document.hidden) animation.pause();
        else animation.play();

      button.hidden = false;
      button.disabled = reduced.matches || globalPause;
      button.setAttribute("aria-pressed", String(stopped));
      const label = reduced.matches ? button.dataset.reducedLabel
        : globalPause ? button.dataset.globalLabel
        : paused ? button.dataset.playLabel : button.dataset.pauseLabel;
      button.setAttribute("aria-label", label);
      button.title = label;
    }
    button.addEventListener("click", () => { paused = !paused; sync(); });
    reduced.addEventListener("change", sync);
    document.addEventListener("visibilitychange", sync);
    new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; sync(); }).observe(figure);
    }
    sync();
  });
})();

      document.documentElement.dataset.theme = dark ? "dark" : "light";
